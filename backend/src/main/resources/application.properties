spring.application.name=projectCTD

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Spring Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL (CORS allowed origin and links in emails)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# JWT
# Secret: Base64-encoded key of at least 256 bits. No default here: must come from JWT_SECRET
# (application-dev.properties provides a development-only fallback).
jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (86400000 = 24 hs)
jwt.expiration=${JWT_EXPIRATION:86400000}
